<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <script>
      // Fix GitHub Pages trailing slash issue for relative paths
      var path = window.location.pathname;
      if (!path.endsWith('/') && path.split('/').pop().indexOf('.') === -1) {
        window.location.replace(path + '/' + window.location.search + window.location.hash);
      }
      // Display errors on screen instead of a blank white page
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="color:red; background:white; position:fixed; z-index:9999; top:0; left:0; width:100%; padding:20px; font-family:sans-serif; text-align:left; box-shadow:0 4px 6px rgba(0,0,0,0.1);"><b>JavaScript Error:</b> ' + event.message + '<br><small>' + event.filename + ':' + event.lineno + '</small></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; background:white; position:fixed; z-index:9999; top:80px; left:0; width:100%; padding:20px; font-family:sans-serif; text-align:left; box-shadow:0 4px 6px rgba(0,0,0,0.1);"><b>Unhandled Promise:</b> ' + event.reason + '</div>';
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Department of Mathematics | Dudhnoi College</title>

    <meta property="og:title" content="Department of Mathematics - Dudhnoi College" />
    <meta property="og:description" content="Exploring Patterns. Solving Problems. Shaping the Future. Academic excellence in Mathematical Sciences." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
  </head>
